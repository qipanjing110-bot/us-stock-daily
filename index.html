<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>美股日报</title>
  <style>
    :root { --ink:#11243a; --muted:#5f7184; --line:#d8e1ea; --paper:#ffffff; --ground:#f3f6f8; --teal:#0f766e; --navy:#102f46; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--ground); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(1120px,calc(100% - 32px)); margin:0 auto; }
    header { background:var(--navy); color:#fff; }
    .brand { display:flex; align-items:center; gap:10px; min-height:66px; font-size:19px; font-weight:800; letter-spacing:0; }
    .brand-mark { display:grid; place-items:center; width:31px; height:31px; border:1px solid #7ad2c6; color:#a9efe5; font-size:13px; }
    main { padding:28px 0 48px; }
    .kicker { margin:0 0 8px; color:var(--teal); font-size:14px; font-weight:800; }
    h1 { margin:0; font-size:36px; line-height:1.2; letter-spacing:0; }
    .intro { margin:10px 0 23px; color:var(--muted); font-size:16px; line-height:1.65; }
    .report { overflow:hidden; border:1px solid var(--line); background:var(--paper); }
    .report-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); }
    .report-head h2 { margin:0; font-size:22px; line-height:1.35; }
    .report-head p { margin:4px 0 0; color:var(--muted); font-size:14px; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; justify-content:flex-end; }
    .button { display:inline-flex; align-items:center; min-height:38px; padding:8px 12px; border:1px solid var(--teal); color:var(--teal); font-size:14px; font-weight:800; white-space:nowrap; }
    .button.primary { background:var(--teal); color:#fff; }
    .report-image { display:block; width:100%; height:auto; background:#fff; }
    .archive-section { margin-top:36px; }
    .archive-section h2 { margin:0 0 12px; font-size:22px; }
    .archive { display:grid; grid-template-columns:150px 1fr auto; align-items:center; gap:16px; padding:15px 18px; border:1px solid var(--line); border-bottom:0; background:var(--paper); }
    .archive:last-child { border-bottom:1px solid var(--line); }
    .archive:hover { background:#f7fbfb; }
    .date { color:var(--teal); font-size:14px; font-weight:800; }
    .archive-title { display:block; font-weight:800; }
    .archive-note { display:block; margin-top:3px; color:var(--muted); font-size:13px; }
    .arrow { color:var(--teal); font-size:20px; }
    footer { border-top:1px solid var(--line); padding:22px 0 34px; color:var(--muted); font-size:13px; line-height:1.6; }
    @media (max-width:680px) { .wrap { width:min(100% - 22px,1120px); } main { padding-top:20px; } h1 { font-size:30px; } .report-head { display:block; padding:16px; } .actions { justify-content:flex-start; margin-top:13px; } .archive { grid-template-columns:1fr auto; gap:8px; } .archive .date { grid-column:1 / -1; } }
  </style>
</head>
